services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vaidora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vaidora
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - vaidora_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaidora"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  vaidora_pg:
