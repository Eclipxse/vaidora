# Install only after the certificate and loopback application are ready.
server {
    listen 80;
    listen [::]:80;
    server_name vaidoraperfume.com www.vaidoraperfume.com;
    location /.well-known/acme-challenge/ {
        root /var/www/vaidora-acme;
    }
    location / {
        return 308 https://vaidoraperfume.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.vaidoraperfume.com;
    ssl_certificate /etc/letsencrypt/live/vaidoraperfume.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vaidoraperfume.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 308 https://vaidoraperfume.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vaidoraperfume.com;
    ssl_certificate /etc/letsencrypt/live/vaidoraperfume.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vaidoraperfume.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    client_max_body_size 64m;
    location /.well-known/acme-challenge/ {
        root /var/www/vaidora-acme;
    }
    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
