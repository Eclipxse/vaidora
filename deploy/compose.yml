name: vaidora-production

x-app: &app
  image: vaidora-perfume:production
  build:
    context: ..
  environment:
    DATABASE_URL: postgresql://vaidora:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/vaidora
    ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
    SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
    APP_ORIGIN: ${APP_ORIGIN:-https://vaidoraperfume.com}
  volumes:
    - masters:/app/public/masters
    - products:/app/public/products
    - uploads:/app/public/uploads
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: vaidora
      POSTGRES_USER: vaidora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaidora -d vaidora"]
      interval: 5s
      timeout: 5s
      retries: 20

  bootstrap:
    <<: *app
    profiles: [setup]
    command:
      [
        "node",
        "node_modules/tsx/dist/cli.mjs",
        "scripts/bootstrap-production.ts",
      ]
    healthcheck:
      disable: true

  web:
    <<: *app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3080}:3000"

  worker:
    <<: *app
    restart: unless-stopped
    command: ["node", "node_modules/tsx/dist/cli.mjs", "scripts/worker.ts"]
    healthcheck:
      disable: true

  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  postgres:
  masters:
  products:
  uploads:
  caddy-data:
  caddy-config:
